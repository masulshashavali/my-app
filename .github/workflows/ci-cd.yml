name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, ec2] # must match your runner's labels

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Backend
      - name: Build and Push Backend
        run: |
          docker build -t mshashu/my-app:backend-${{ github.sha }} ./backend
          docker push mshashu/my-app:backend-${{ github.sha }}

      # Build and Push Frontend
      - name: Build and Push Frontend
        run: |
          docker build -t mshashu/my-app:frontend-${{ github.sha }} ./frontend
          docker push mshashu/my-app:frontend-${{ github.sha }}

      # Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Configure kubeconfig from GitHub secret
      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/backend backend=mshashu/my-app:backend-${{ github.sha }}
          kubectl set image deployment/frontend frontend=mshashu/my-app:frontend-${{ github.sha }}
